<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="gpui-styleguidist" />
    <title>{{title}}</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 14px system-ui, sans-serif; color: #6e6e76; pointer-events: none;
      }
      #status.error { color: #c62828; white-space: pre-wrap; padding: 24px; }
    </style>
  </head>
  <body>
    <div id="status">Loading {{title}}…</div>
    <script type="module">
      import init from "./styleguide.js";
      const status = document.getElementById("status");
      // The gallery's `main` runs as the module's start function.
      init()
        .then(() => {
          const ready = () => document.querySelector("body > canvas") ? status.remove() : requestAnimationFrame(ready);
          ready();
        })
        .catch((error) => {
          status.classList.add("error");
          status.textContent = "The styleguide failed to start:\n" + error;
          console.error(error);
        });
    </script>
    {{reload}}
  </body>
</html>
