[workspace]
resolver = "2"
members = ["crates/styleguidist", "crates/cli", "examples/kit-demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Ziinc/gpui-styleguidist"

[workspace.dependencies]
gpui-styleguidist = { path = "crates/styleguidist", version = "0.1.0", default-features = false }
# The exact gpui-pre snapshot gpui-kit 0.7.3 is built against. Any snapshot can
# change GPUI's API, so consumers must use the same one; bump them together.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_web = { package = "gpui-pre-web", version = "=0.3.9" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
