name: Publish

# Publishes the workspace crates to crates.io when a GitHub release is
# published. The release tag must match the workspace version, as `v0.2.0` or
# `0.2.0`. Re-running is safe: versions already on crates.io are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # `cargo publish` builds each crate before uploading it, and
      # gpui-styleguidist's default `gallery` feature links GPUI's platform.
      - name: Install GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the workspace version
        if: github.event_name == 'release'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gpui-styleguidist") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi
          # Dependencies first; cargo waits for each upload to reach the index.
          for crate in gpui-styleguidist-manifest gpui-styleguidist-macros gpui-styleguidist cargo-styleguide; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if curl -sf -o /dev/null -A "gpui-styleguidist-publish (https://github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io; skipping"
              continue
            fi
            cargo publish -p "$crate" --locked
          done
